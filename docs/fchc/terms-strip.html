<!doctype html><meta charset="utf-8">
<style>
:root{--ink:#15181d;--muted:#5f6874;--green:#1d7a5c;--rule:#c9d5d1}
body{margin:0;background:#fff;font:30px/1.35 Arial,Helvetica,sans-serif;color:var(--ink)}
.wrap{width:2160px;box-sizing:border-box;border-top:3px solid var(--rule);
      border-bottom:3px solid var(--rule);padding:30px 0 34px}
.row{display:grid;grid-template-columns:repeat(4,1fr)}
.c{padding:0 34px;border-left:3px solid var(--rule)}
.c:first-child{border-left:0;padding-left:0}
.c b{display:block;font-size:76px;line-height:1;color:var(--green);font-weight:bold}
.c span{display:block;font-size:28px;line-height:1.3;color:var(--muted);margin-top:14px}
</style>
<div class="wrap"><div class="row">
  <div class="c"><b>70</b><span>clinic days a year,<br>two a week</span></div>
  <div class="c"><b>1,050</b><span>clocked hours a year,<br>15 a clinic day</span></div>
  <div class="c"><b>1,120</b><span>visits a year<br>at 16 a day</span></div>
  <div class="c"><b>$42,000</b><span>a year,<br>at $40 an hour</span></div>
</div></div>
