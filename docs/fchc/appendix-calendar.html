<!doctype html><meta charset="utf-8">
<style>
:root{--ink:#15181d;--muted:#5f6874;--base:#eef1f0;
      --cl:#1d7a5c;--in:#e0d2bb;--in-ink:#6b5c45;--off:#e3e8e6;--off-ink:#8e9896}
body{background:#fff;color:var(--ink);margin:0;
     font:15px/1.5 Arial,Helvetica,sans-serif}
.wrap{width:1120px;padding:2px 0 6px}
.keys{display:flex;gap:26px;align-items:center;margin-bottom:14px}
.key{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.sw{width:19px;height:19px;border-radius:4px;flex:none}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mo{background:var(--base);border-radius:10px;padding:11px}
.mo h2{font-size:12px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;
       margin:0 0 7px;color:var(--muted)}
.dows,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dows div{font-size:9.5px;text-align:center;padding-bottom:3px;color:var(--muted)}
.cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;
      justify-content:center;font-size:10.5px}
.blank{background:none}
.cl{background:var(--cl);color:#fff;font-weight:bold}
.in{background:var(--in);color:var(--in-ink)}
.off{background:var(--off);color:var(--off-ink)}
</style>
<div class="wrap">
  <div class="keys">
    <span class="key"><span class="sw" style="background:var(--cl)"></span>In clinic</span>
    <span class="key"><span class="sw" style="background:var(--in)"></span>In town</span>
    <span class="key"><span class="sw" style="background:var(--off)"></span>Weekends and time off</span>
  </div>
  <div class="months" id="months"></div>
</div>
