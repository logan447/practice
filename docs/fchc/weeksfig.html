<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font:11pt/1.2 Arial,Helvetica,sans-serif;color:#111}
  .fig{width:720px}
  .lab{position:relative;height:30px}
  .lab span{position:absolute;font-size:8.5pt;font-weight:bold;white-space:nowrap}
  .strip{position:relative;height:24px;background:#ececec;margin-bottom:3px}
  .blk{position:absolute;top:0;bottom:0;background:#4a4a4a}
  .ticks{position:absolute;top:0;bottom:0;width:100%}
  .ticks i{position:absolute;top:0;bottom:0;width:1px;background:#fff}
  .months{position:relative;height:14px;font-size:8.5pt;color:#444}
  .months span{position:absolute;transform:translateX(-50%)}
  .cap{font-size:8.5pt;color:#444;margin-top:4px}
</style>
<div class="fig" id="fig">
  <div class="lab" id="lab"></div>
  <div class="strip" id="strip"><div class="ticks" id="ticks"></div></div>
  <div class="months" id="mo"></div>
  <div class="cap">Twelve weeks off, in six blocks. Everything else is a working week.</div>
</div>
<script>
var Y=2029, JAN1=Date.UTC(Y,0,1), YEARLEN=365;
function doy(m,d){return Math.round((Date.UTC(Y,m-1,d)-JAN1)/86400000);}
function pct(n){return n/YEARLEN*100;}
var OFF=[[[1,1],[1,13],'New Year',0],
         [[4,1],[4,7],'Spring break',1],
         [[5,6],[5,19],'May',0],
         [[7,22],[8,11],'Summer',1],
         [[11,18],[12,1],'Thanksgiving',0],
         [[12,16],[12,31],'Christmas',1]];
var B='',L='';
OFF.forEach(function(o){
  var s=doy(o[0][0],o[0][1]), e=doy(o[1][0],o[1][1])+1;
  B+='<div class="blk" style="left:'+pct(s)+'%;width:'+pct(e-s)+'%"></div>';
  var mid=pct((s+e)/2), top=o[3]?16:1;
  var style;
  if (mid<10)      style='left:0;top:'+top+'px';
  else if (mid>90) style='right:0;top:'+top+'px';
  else             style='left:'+mid+'%;top:'+top+'px;transform:translateX(-50%)';
  L+='<span style="'+style+'">'+o[2]+'</span>';
});
document.getElementById('strip').insertAdjacentHTML('afterbegin',B);
document.getElementById('lab').innerHTML=L;
var T='',M='',MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
for(var m=1;m<=12;m++){
  var st=doy(m,1), en=(m===12?YEARLEN:doy(m+1,1));
  if(m>1) T+='<i style="left:'+pct(st)+'%"></i>';
  M+='<span style="left:'+pct((st+en)/2)+'%">'+MN[m-1]+'</span>';
}
document.getElementById('ticks').innerHTML=T;
document.getElementById('mo').innerHTML=M;
</script>
